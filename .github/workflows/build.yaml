name: Build

on: [push, pull_request]

jobs:
  build-cmake:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
        include:
        - os: ubuntu-26.04
          cmake-args: -G Ninja
          package-file: "*-linux_x86_64.tar.xz"
          archtitecture: "x86_64"
          shell: "bash"
          env:
            CFLAGS: -Werror
            CXXFLAGS: -Werror
        - os: windows-latest
          cmake-args: -G Ninja
          package-file: "*-win64.7z"
          archtitecture: "x86_64"
          shell: "msys2"
          env:
            CFLAGS: -Werror
            CXXFLAGS: -Werror
            LDFLAGS: -Werror
    defaults:
      run:
        shell: ${{ matrix.shell }} {0}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Prepare MSYS2 (Windows)
      if: contains(matrix.os, 'windows')
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        pacboy: >-
          toolchain:p
          cmake:p
          ninja:p
          zlib:p
          opus:p
          opusfile:p
          openssl:p
          curl:p
          libspng:p
          sqlite3:p
          postgresql:p

    - name: Prepare Linux
      if: contains(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update -y
        sudo apt install build-essential cmake git libspng-dev libopus-dev libopusfile-dev python3 libcurl4-openssl-dev -y

    - name: Build in debug mode
      env: ${{ matrix.env }}
      run: |
        mkdir debug
        cd debug
        cmake --version
        cmake ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=Debug -Werror=dev -DDOWNLOAD_GTEST=ON -DDEV=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_DEBUG=. ..
        cmake --build . --config Debug --target everything

    - name: Test debug
      run: |
        cd debug
        cmake --build . --config Debug --target run_tests
  
    - name: Run debug server
      env: ${{ matrix.env }}
      run: |
        cd debug
        ./ArchiveServer shutdown

    - name: Build in release mode
      env: ${{ matrix.env }}
      run: |
        mkdir release
        cd release
        cmake ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=Release -Werror=dev -DDOWNLOAD_GTEST=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. ..
        cmake --build . --config Release --target everything

    - name: Test release
      run: |
        cd release
        cmake --build . --config Release --target run_tests

    - name: Run release server
      env: ${{ matrix.env }}
      run: |
        cd release
        ./ArchiveServer shutdown

    - name: Package
      run: |
        cd release
        cmake ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=Releas -DMACOS_DO_INSTALL=ON -Werror=dev -DDOWNLOAD_GTEST=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. ..
        cmake --build . --config Release --target everything
        cpack -V
        mkdir artifacts
        mv ${{ matrix.package-file }} artifacts

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: teeworlds-archive-${{ matrix.os }}
        path: release/artifacts